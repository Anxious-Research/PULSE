description: The PULSE desktop app in your browser. `pulse workbench` serves the desktop interface through the PULSE dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Nous product. On the first `pulse workbench` run and again after each PULSE update it runs `npm install --ignore-scripts` (guided by PULSE's lockfile) and Vite against your PULSE checkout's desktop sources, writing only under ~/.pulse/pulse-workbench and its own plugin dir (the checkout is only read), and starts `pulse dashboard` on loopback when none is running.
