description: Hindsight long-term memory provider — knowledge graph, entity resolution and multi-strategy
  retrieval (recall/reflect/retain tools plus automatic per-turn capture). Maintained by Vectorize;
  cloud and local external modes are available. Local embedded mode is not supported on PM-managed
  Pulse with this plugin pin — it still calls the retired lazy-install path for `hindsight-all`.
  `pulse memory setup` fetches its bank-template catalog from raw.githubusercontent.com
  (vectorize-io/hindsight main).
maintainer: vectorize-io
tier: community
category: memory
requires_pulse: ">=0.21.4"
known_issues:
  - "Local embedded mode is not supported on PM-managed Pulse with this plugin pin — it still calls the retired lazy-install path for `hindsight-all`, which loops update takeover on every conversation. On managed installs prefer `local_external` or cloud mode."
